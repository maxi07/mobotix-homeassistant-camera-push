name: Publish image

# Publish a released image to the GitHub Container Registry.
#
# Only version tags publish. Creating a release in the web UI creates its tag
# and therefore triggers this too. Pushes to main deliberately publish
# nothing: main is verified by the test workflow, but what gets deployed is
# always a release someone decided to cut.
#
# Pull requests build without pushing, so the Dockerfile stays verified for
# every architecture without publishing from a branch.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Needed to build the arm64 image on an amd64 runner, so the image
      # also runs on a Raspberry Pi.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=auto moves 'latest' to the newest semver release, and
          # never to a pre-release such as v1.1.0-rc1.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Mobotix Home Assistant camera push
            org.opencontainers.image.description=Forward Mobotix T25 notifications with alarm image to Home Assistant

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
