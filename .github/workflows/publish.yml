name: Publish image

# Publish a released image to the GitHub Container Registry.
#
# Only version tags publish. Creating a release in the web UI creates its tag
# and therefore triggers this too. Pushes to main deliberately publish
# nothing: main is verified by the test workflow, but what gets deployed is
# always a release someone decided to cut.
#
# The build and the publish are separate jobs on purpose. A pull request can
# modify this file, so the job it runs must never hold a token that can write
# to or delete packages. Only the tag job gets packages: write.
on:
  push:
    tags: ["v*"]
  pull_request:

# Read-only by default. The publish job raises this for itself alone.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (no publish)
    # Verifies the Dockerfile still builds for every architecture. Never
    # pushes, and never holds package-write permission.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # Needed to build the arm64 image on an amd64 runner, so the image
      # also runs on a Raspberry Pi.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: build and push
    # Belt and braces: the trigger already limits this to v* tags, and the
    # condition repeats it so a future trigger change cannot silently start
    # publishing from a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=auto moves 'latest' to the newest semver release, and
          # never to a pre-release such as v1.1.0-rc1.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Mobotix Home Assistant camera push
            org.opencontainers.image.description=Forward Mobotix T25 notifications with alarm image to Home Assistant

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
