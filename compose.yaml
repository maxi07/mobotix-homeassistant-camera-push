services:
  mobotix-relay:
    # Published image. `docker compose pull` fetches it, so a deployment
    # needs only this file and .env -- no source checkout, no build.
    # Pin a release with IMAGE_TAG=v1.0.0 instead of the default latest.
    image: ghcr.io/maxi07/mobotix-homeassistant-camera-push:${IMAGE_TAG:-latest}
    # Kept so `docker compose up -d --build` still builds from source
    # when working on the code.
    build: .
    container_name: mobotix-relay
    restart: unless-stopped
    ports:
      - "${RELAY_PORT:-18425}:18425"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HA_WEBHOOK_URL: "${HA_WEBHOOK_URL:?Set HA_WEBHOOK_URL in .env}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-10}"
      RETRY_COUNT: "${RETRY_COUNT:-3}"
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      IMAGE_RETENTION_MINUTES: "${IMAGE_RETENTION_MINUTES:-60}"
      URL_TTL_SECONDS: "${URL_TTL_SECONDS:-900}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_JURISDICTION: "${R2_JURISDICTION:-}"
      R2_ENDPOINT_URL: "${R2_ENDPOINT_URL:-}"
      R2_KEY_PREFIX: "${R2_KEY_PREFIX-mobotix-relay}"
      R2_SIGNING_REGION: "${R2_SIGNING_REGION:-auto}"
      R2_VERIFY_ON_START: "${R2_VERIFY_ON_START:-true}"
    volumes:
      - relay-images:/data/images
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18425/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  relay-images:
